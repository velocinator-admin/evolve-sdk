name: Release

# Changesets: on main, either opens a "Version packages" PR or, once that PR is
# merged, publishes next-evolve and @next-evolve/protocol to npm.
# Auth: npm trusted publishing (OIDC), configured on npmjs.com for both
# packages (velocinator-admin/evolve-sdk, release.yml). No npm token. It needs
# npm >= 11.5 (pnpm publish shells out to npm). Provenance stays off while the
# repo is private.
# The Version PR step can't open PRs (repo setting), so version locally with
# `pnpm changeset version`, commit to main, and this workflow publishes.
# Pushes to main publish only while the repo variable RELEASE_ENABLED is "true".

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and dry-run publish only"
        type: boolean
        default: true
      tag_alpha_only:
        description: "Only point the alpha dist-tag at the current versions (no publish)"
        type: boolean
        default: false

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter='./packages/*'

      - name: Dry-run publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          # Trusted publishing check: the OIDC exchange returns a publish token
          # only if npmjs.com trusts this repo + workflow for the package.
          oidc=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          for pkg in next-evolve @next-evolve%2fprotocol; do
            curl -sf -X POST -H "Authorization: Bearer $oidc" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$pkg" \
              | jq -e '.token | length > 0' >/dev/null \
              || { echo "trusted publishing NOT set up for $pkg"; exit 1; }
            echo "trusted publishing ok: $pkg"
          done
          pnpm -r --filter='./packages/*' publish --dry-run --no-git-checks --access public

      - name: Version PR or publish
        id: changesets
        if: github.event_name == 'push' || (!inputs.dry_run && !inputs.tag_alpha_only)
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: false

      # Phase 1 alpha (T12.8): every release is both `latest` (changeset publish's
      # default, so `npx next-evolve init` works) and `alpha`. dist-tag isn't covered
      # by npm's own OIDC support, so exchange the OIDC token per package and call
      # the registry's dist-tag API directly. If npm refuses, the log says so and
      # the fallback is `npm dist-tag add <pkg>@<ver> alpha` from a logged-in shell.
      - name: Tag alpha
        if: steps.changesets.outputs.published == 'true' || inputs.tag_alpha_only
        continue-on-error: true
        run: |
          oidc=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          status=0
          for dir in packages/next-evolve packages/protocol; do
            name=$(jq -r .name $dir/package.json); ver=$(jq -r .version $dir/package.json)
            enc=$(jq -rn --arg n "$name" '$n|@uri')
            token=$(curl -sf -X POST -H "Authorization: Bearer $oidc" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$enc" | jq -r .token)
            code=$(curl -s -o /tmp/out -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $token" -H "content-type: application/json" \
              --data "\"$ver\"" "https://registry.npmjs.org/-/package/$enc/dist-tags/alpha")
            echo "$name@$ver alpha: HTTP $code $(cat /tmp/out)"
            [ "$code" = 200 ] || [ "$code" = 201 ] || status=1
          done
          npm view next-evolve dist-tags; npm view @next-evolve/protocol dist-tags
          exit $status
